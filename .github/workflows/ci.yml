name: CI

on:
  pull_request:
  push:
    branches: [dev, prod]
    # A release tag runs CI too, so a release shows its checks whichever branch it is on.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Database migrations apply to an empty database, then again with nothing to do
        run: npx wrangler d1 migrations apply DB --local && npx wrangler d1 migrations apply DB --local
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

